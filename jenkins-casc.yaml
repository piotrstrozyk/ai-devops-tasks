
jenkins:
  systemMessage: "Jenkins skonfigurowany automatycznie przez JCasC"

  numExecutors: 3
  mode: NORMAL

  scmCheckoutRetryCount: 2

  quietPeriod: 5

  remotingSecurity:
    enabled: true

  # Podstawowa konfiguracja logowania
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER}"
          password: "${JENKINS_ADMIN_PASSWORD}"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  # Globalne właściwości systemowe
  globalNodeProperties:
    - envVars:
        env:
          - key: ENVIRONMENT
            value: "development"

unclassified:

  # Timeout połączenia HTTP
  location:
    url: "http://jenkins.example.com/"

  # Globalne konfiguracje narzędzi
  globalLibraries: {}

tool:

  # Maven
  maven:
    installations:
      - name: "Maven-3.9"
        properties:
          - installSource:
              installers:
                - maven:
                    id: "3.9.9"

  # Node.js
  nodejs:
    installations:
      - name: "NodeJS-20"
        properties:
          - installSource:
              installers:
                - nodeJSInstaller:
                    id: "20.18.0"
                    npmPackagesRefreshHours: 72

  # Docker
  dockerTool:
    installations:
      - name: "Docker"
        properties: []

# Konfiguracja wtyczek
# Instalacja pluginów odbywa się osobno,
# np. poprzez plugins.txt lub plugin manager.

# Przykładowe zadanie Pipeline
jobs:
  - script: >
      pipelineJob('example-pipeline') {
        description('Przykładowy pipeline zarządzany przez JCasC')

        definition {
          cps {
            script('''
              pipeline {
                agent any

                tools {
                  maven 'Maven-3.9'
                  nodejs 'NodeJS-20'
                }

                environment {
                  APP_NAME = 'example-app'
                }

                stages {
                  stage('Checkout') {
                    steps {
                      echo 'Pobieranie kodu źródłowego'
                      checkout scm
                    }
                  }

                  stage('Build') {
                    steps {
                      sh 'mvn clean package'
                    }
                  }

                  stage('Test') {
                    steps {
                      sh 'mvn test'
                    }
                  }

                  stage('Node Build') {
                    steps {
                      sh 'npm install'
                      sh 'npm run build'
                    }
                  }

                  stage('Docker Build') {
                    steps {
                      sh 'docker build -t example-app:latest .'
                    }
                  }
                }

                post {
                  success {
                    echo 'Pipeline zakończony sukcesem'
                  }

                  failure {
                    echo 'Pipeline zakończony błędem'
                  }

                  always {
                    echo 'Koniec wykonania pipeline'
                  }
                }
              }
            ''')

            sandbox()
          }
        }
      }
